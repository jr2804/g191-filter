[tasks.test]
description = "Run tests with coverage"
# --no-sync: uv run would re-sync and replace the maturin-built package
# (with _native) by the hatchling-built one (without it) — see #550.
run = "uv run --no-sync pytest --cov=g191_filter"
sources = ["src/**/*.py", "tests/**/*.py"]
outputs = ["htmlcov/", ".coverage"]

[tasks.all]
description = "Run all quality checks"
depends = [
  "test",
  "lint",
  "spell",
  "format",
  "format-md",
  "docs",
]

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov docs/_build"]
