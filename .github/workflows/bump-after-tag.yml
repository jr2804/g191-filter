name: bump-after-tag
# The release workflow stamps version numbers into a *throwaway runner
# checkout* — those files never reach HEAD of main. Without a follow-up
# commit, installs via `uv add git+https://github.com/jr2804/g191-filter.git`
# (which build from HEAD, not a tag) report `g191-filter==0.0.0` no matter
# which tag was released.
#
# This workflow fires when `release` completes, reads the CalVer tag the
# release just published, and stamps it into Cargo.toml, pyproject.toml and
# python/g191_filter/_version.py as a follow-up commit on main.
#
# NOTE: a `on: push: tags:` trigger was tried first — it never fired because
# the tag was pushed by release.yml using GITHUB_TOKEN, and GitHub suppresses
# downstream workflow triggers for events caused by that token.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  bump:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to resolve the newest CalVer tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp version files and push bump commit
        shell: bash
        run: |
          set -euo pipefail
          # The release workflow just tagged HEAD. Read that tag's version.
          version="$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$version" ]; then
            echo "No CalVer tag on HEAD; nothing to do."
            exit 0
          fi
          # Skip if the commit already carries the stamp (retry after a manual fix).
          current="$(sed -nE 's/^version = "([^"]*)"$/\1/p' Cargo.toml | head -n1 || true)"
          if [ "$current" = "$version" ]; then
            echo "Cargo.toml already at $version; skipping."
            exit 0
          fi
          sed -i.bak -E 's/^version = "0\.0\.0"$/version = "'"$version"'"/' Cargo.toml
          sed -i.bak -E 's/^version = "0\.0\.0"$/version = "'"$version"'"/' pyproject.toml
          sed -i.bak -E 's/^__version__ = "0\.0\.0"$/__version__ = "'"$version"'"/' python/g191_filter/_version.py
          # Cargo.lock records the workspace member's version too. Leaving it
          # behind makes every `cargo` invocation rewrite it, so main would
          # ship a permanently dirty lock file. Address the block by name
          # instead of a bare pattern — Cargo.lock is full of version lines.
          sed -i.bak -E '/^name = "g191_filter_core"$/{n;s/^version = .*$/version = "'"$version"'"/}' Cargo.lock
          rm -f Cargo.toml.bak pyproject.toml.bak python/g191_filter/_version.py.bak Cargo.lock.bak
          grep -q "^version = \"$version\"$" Cargo.toml
          grep -q "^version = \"$version\"$" pyproject.toml
          grep -q "^__version__ = \"$version\"$" python/g191_filter/_version.py
          grep -A 1 '^name = "g191_filter_core"$' Cargo.lock | grep -q "^version = \"$version\"$"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml pyproject.toml python/g191_filter/_version.py Cargo.lock
          git commit -m "chore(release): stamp $version"
          git push origin HEAD:main
