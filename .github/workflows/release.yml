name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needs_tag: ${{ steps.version.outputs.needs_tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next calendar version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          existing_head_tag="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$existing_head_tag" ]; then
            echo "version=$existing_head_tag" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          year="$(date -u +%Y)"
          month="$((10#$(date -u +%m)))"
          git fetch --tags --force
          prefix="${year}.${month}."
          highest="$(git tag --list "${prefix}*" | sed -n "s/^${year}\\.${month}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -n 1)"
          counter="${highest:-0}"
          next="$((counter + 1))"
          version="${year}.${month}.${next}"
          while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
            next="$((next + 1))"
            version="${year}.${month}.${next}"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "needs_tag=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.needs_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # uv-dynamic-versioning reads git tags to derive the sdist version.
          # Without these it falls back to `0.0.0.post1.dev0+<sha>` even when
          # the version job has just created the matching tag upstream, so
          # the sdist filename doesn't match the release tag.
          fetch-depth: 0
          fetch-tags: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Sync Cargo version
        shell: bash
        run: |
          sed -i -E 's/^version = "[0-9][^"]*"$/version = "${{ needs.version.outputs.version }}"/' src/g191_filter/Cargo.toml
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo version
        shell: bash
        run: |
          sed -i -E 's/^version = "[0-9][^"]*"$/version = "${{ needs.version.outputs.version }}"/' src/g191_filter/Cargo.toml || sed -i '' -E 's/^version = "[0-9][^"]*"$/version = "${{ needs.version.outputs.version }}"/' src/g191_filter/Cargo.toml

      # macOS, Windows, and non-manylinux Linux builds run on the host, so
      # they need explicit interpreter installation. The Linux aarch64 job
      # uses the manylinux container and skips this step (interpreter is
      # bundled under /opt/python on PATH inside the container).
      - name: Setup Python
        if: matrix.os != 'ubuntu-latest' || matrix.target != 'aarch64'
        uses: actions/setup-python@v6
        with:
          # 3.13t is omitted: PyO3 0.29 rejects free-threaded CPython builds
          # below 3.14 (`PyO3 does not support the free-threaded build of
          # CPython versions below 3.14`). To support 3.13t too, we'd need to
          # pin an older PyO3 that still allows experimental 3.13t builds.
          python-version: |
            3.13
            3.14
            3.14t

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `--find-interpreter` discovers all CPython interpreters
          # (regular + free-threaded) on PATH. Bundled in manylinux
          # containers; installed by `actions/setup-python` on host jobs.
          # Do NOT combine `--find-interpreter` with `-i <path>` — they
          # are mutually exclusive in `maturin build`.
          args: --release --find-interpreter
          working-directory: .

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          # maturin-action writes wheels under the Cargo crate's directory
          # (src/g191_filter/target/wheels/), not the workflow's cwd.
          path: src/g191_filter/target/wheels/*.whl

  publish-release:
    needs: [version, sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
