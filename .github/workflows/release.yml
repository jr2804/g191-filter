name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    # Skip when the push was itself a release-version stamp — otherwise a
    # stamp pushed with a PAT (rather than the auto GITHUB_TOKEN, for which
    # GitHub suppresses downstream triggers) would loop forever.
    if: >-
      github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, 'chore(release): stamp')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needs_tag: ${{ steps.version.outputs.needs_tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next calendar version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          existing_head_tag="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$existing_head_tag" ]; then
            echo "version=$existing_head_tag" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          year="$(date -u +%Y)"
          month="$((10#$(date -u +%m)))"
          git fetch --tags --force
          prefix="${year}.${month}."
          highest="$(git tag --list "${prefix}*" | sed -n "s/^${year}\\.${month}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -n 1)"
          counter="${highest:-0}"
          next="$((counter + 1))"
          version="${year}.${month}.${next}"
          while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
            next="$((next + 1))"
            version="${year}.${month}.${next}"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "needs_tag=true" >> "$GITHUB_OUTPUT"

      # Stamp the released version and commit it to main *before* tagging, so
      # the tag, the artifacts and the tip of main all agree. Stamping only in
      # the build jobs' throwaway checkouts (the earlier design) left main
      # reporting the previous release, and made a tag-pinned
      # `uv add git+...@<tag>` build a wheel carrying that previous version.
      # The build jobs then check out the tag and need no sync of their own.
      #
      # Each source file has exactly one version line at column 0. Cargo.lock is
      # addressed by package name because it is full of version lines.
      - name: Stamp version and push to main
        if: steps.version.outputs.needs_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.version }}"
          sed -i.bak -E 's/^version = "[^"]+"$/version = "'"$ver"'"/' Cargo.toml
          sed -i.bak -E 's/^version = "[^"]+"$/version = "'"$ver"'"/' pyproject.toml
          sed -i.bak -E 's/^__version__ = "[^"]+"$/__version__ = "'"$ver"'"/' python/g191_filter/_version.py
          sed -i.bak -E '/^name = "g191_filter_core"$/{n;s/^version = .*$/version = "'"$ver"'"/}' Cargo.lock
          rm -f Cargo.toml.bak pyproject.toml.bak python/g191_filter/_version.py.bak Cargo.lock.bak
          grep -q "^version = \"$ver\"$" Cargo.toml
          grep -q "^version = \"$ver\"$" pyproject.toml
          grep -q "^__version__ = \"$ver\"$" python/g191_filter/_version.py
          grep -A 1 '^name = "g191_filter_core"$' Cargo.lock | grep -q "^version = \"$ver\"$"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock pyproject.toml python/g191_filter/_version.py
          git commit -m "chore(release): stamp $ver"
          git push origin HEAD:main

      - name: Create and push tag
        if: steps.version.outputs.needs_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # Build the tag, not the triggering commit: the tag carries the stamped
      # version, so this job needs no version sync.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Host builds. One interpreter per job: `actions/setup-python` keeps only
  # one flavour of a given version on PATH (asking for `3.14` and `3.14t`
  # repoints pythonLocation/LD_LIBRARY_PATH at the free-threaded build and, on
  # Windows, removes the standard entry), so `--find-interpreter` could only
  # ever produce one 3.14 flavour per job and the standard 3.14 wheels were
  # missing everywhere except the manylinux container. Each job therefore
  # installs exactly one interpreter and builds with `-i <path>`.
  wheels:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, python: "3.13" }
          - { os: ubuntu-latest, target: x86_64, python: "3.14" }
          - { os: ubuntu-latest, target: x86_64, python: "3.14t" }
          - { os: windows-latest, target: x64, python: "3.13" }
          - { os: windows-latest, target: x64, python: "3.14" }
          - { os: windows-latest, target: x64, python: "3.14t" }
          - { os: macos-latest, target: aarch64, python: "3.13" }
          - { os: macos-latest, target: aarch64, python: "3.14" }
          - { os: macos-latest, target: aarch64, python: "3.14t" }
          - { os: macos-latest, target: x86_64, python: "3.13" }
          - { os: macos-latest, target: x86_64, python: "3.14" }
          - { os: macos-latest, target: x86_64, python: "3.14t" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}

      # 3.13t is deliberately absent: PyO3 0.29 rejects free-threaded CPython
      # builds below 3.14 (`PyO3 does not support the free-threaded build of
      # CPython versions below 3.14`), and it is the newest PyO3 release.
      # Revisit if a later PyO3 lowers that floor.
      - name: Setup Python ${{ matrix.python }}
        id: pys
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `-i` takes the interpreter's executable, so the wheel is built for
          # exactly the one interpreter this job installed. `--find-interpreter`
          # would be ambiguous here — it is kept for the container job below,
          # where all interpreters are present and discoverable. The two are
          # mutually exclusive in a single `maturin build` invocation.
          args: --release -i ${{ steps.pys.outputs.python-path }}
          working-directory: .

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.python }}
          # maturin-action writes wheels under the Cargo crate's target/
          # (project root after the restructure: src/ = Rust sources,
          # python/g191_filter/ = Python wrapper).
          path: target/wheels/*.whl

  # The manylinux aarch64 image ships every CPython under /opt/python, so one
  # job yields all three interpreters and no setup-python step is needed.
  wheels-linux-aarch64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --find-interpreter
          working-directory: .

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: target/wheels/*.whl

  publish-release:
    needs: [version, sdist, wheels, wheels-linux-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten wheel artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -name "*.whl" -exec cp {} dist/ \;
          # Defensive: never attach anything but wheels to a release.
          find dist -type f -not -name "*.whl" -delete
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
