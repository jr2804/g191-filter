[package]
name = "g191_filter_core"
# CalVer YYYY.M.N is the single source of truth; the release workflow (and
# scripts/install_from_git.py) rewrite this line before running maturin
# build, together with pyproject.toml and python/g191_filter/_version.py.
# Local dev builds get "0.0.0" (mismatch with releases is expected).
version = "2026.9.10"
edition = "2021"
license = "MIT"
authors = ["Jan.Reimes <jan.reimes@head-acoustics.com>"]
description = "Rust core for ITU-T G.191 FIR/IIR filters"

[lib]
# The lib name IS the Python module name. maturin builds wheels with the
# compiled extension as `g191_filter/g191_filter.{so,pyd}` and our user
# wrapper at `python/g191_filter/__init__.py` does
# `from .g191_filter import *` to re-export Rust functions.
name = "g191_filter"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.15"
hound = "3.5"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
incremental = false
panic = "abort"
