[project]
name = "g191-filter"
# CalVer YYYY.M.N. The release workflow patches this literal alongside
# Cargo.toml's `[package] version` so that wheel METADATA and the sdist
# PKG-INFO agree. Local development leaves this at `0.0.0`; install from
# a release tag (`uv add git+...@v2026.9.13`) for accurate metadata. For
# arbitrary commits, run `python scripts/install_from_git.py` first.
version = "2026.9.10"
description = "IIR/FIR filters according to Recommendation ITU-T G.191 (Software Tool Library). Provided at arbitrary sampling rates and in many formats"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "jan.reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "numpy>=2.0.0",
    "soundfile>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "maturin>=1.5.0",
    "mkdocs-mermaid2-plugin>=1.2",
    "xy>=0.0.7",
]

[project.scripts]
g191-filter = "g191_filter.cli.app:main"


[build-system]
requires = ["maturin>=1.5.0"]
build-backend = "maturin"

[tool.maturin]
# Python wrapper sources live at python/g191_filter/. maturin expects
# `python-source/<package_name>/__init__.py` and bundles those files into
# the wheel alongside the compiled extension (built from the Cargo crate
# at the project root).
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=g191_filter --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
order = ["public", "protected", "private"]
# Method type ordering within each visibility level
method_type_order = ["instance", "class", "static"]
