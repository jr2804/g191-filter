[project]
name = "g191-filter"
dynamic = ["version"]
description = "IIR/FIR filters according to Recommendation ITU-T G.191 (Software Tool Library). Provided at arbitrary sampling rates and in many formats"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "jan.reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "numpy>=2.0.0",
    "soundfile>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "maturin>=1.5.0",
    "mkdocs-mermaid2-plugin>=1.2",
    "xy>=0.0.7",
]

[project.scripts]
g191-filter = "g191_filter.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/g191_filter"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "maturin>=0.20"]
build-backend = "hatchling.build"

[tool.maturin]
manifest-path = "src/g191_filter/Cargo.toml"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
# CalVer YYYY.M.N: version comes exclusively from the release tag
# pushed by .github/workflows/release.yml. uv-dynamic-versioning
# matches the tag with the regex below; `latest-tag` selects the
# most recent matching tag rather than commit-count schemes.
vcs = "git"
style = "pep440"
latest-tag = true
tag-dir = "tags"
pattern = '^(?P<base>\d{4}\.\d{1,2}\.\d+)$' 

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=g191_filter --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
order = ["public", "protected", "private"]
# Method type ordering within each visibility level
method_type_order = ["instance", "class", "static"]
